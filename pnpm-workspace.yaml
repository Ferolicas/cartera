allowBuilds:
  argon2: true
  esbuild: true
  sharp: false
  unrs-resolver: false

# Parches de seguridad de dependencias transitivas (pnpm audit). Cada entrada fija
# la versión parcheada más baja dentro del mismo major; retirar cuando el paquete
# padre ya la exija por sí mismo.
overrides:
  "brace-expansion@<1.1.21": "1.1.21"
  "brace-expansion@>=4.0.0 <5.0.12": "5.0.12"
  "sharp@<0.35.5": "0.35.5"
  "source-map-js@<1.2.2": "1.2.2"
  "zod@>=4.0.0 <4.6.6": "^4.6.6"
